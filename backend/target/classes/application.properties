spring.application.name=farm
spring.config.import=optional:file:./application-local.properties

# Copy the host and username from Supabase > Connect > Session pooler.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Keep these tables outside Supabase's publicly exposed API schema.
spring.flyway.schemas=farm
spring.flyway.default-schema=farm

server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
