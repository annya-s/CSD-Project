spring.application.name=farm
weather.api.enabled=${WEATHER_API_ENABLED:true}
spring.config.import=optional:file:./application-local.properties

# Copy the host and username from Supabase > Connect > Session pooler.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Existing Supabase tables are managed explicitly; never run the legacy schema automatically.
spring.flyway.enabled=false
spring.flyway.schemas=farm
spring.flyway.default-schema=farm

server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never


# Exact case-sensitive identifiers in your existing Supabase table.
app.users.schema=${DB_USER_SCHEMA:public}
app.users.table=${DB_USER_TABLE:USERS}
app.users.id=${DB_USER_ID_COLUMN:User_ID}
app.users.name=${DB_USER_NAME_COLUMN:User_Name}
app.users.email=${DB_USER_EMAIL_COLUMN:User_Email}
app.users.hash=${DB_USER_HASH_COLUMN:Password_Hash}

