# [ERD-ALIGNMENT CHANGE] All application tables now live in public.
spring.application.name=farm
weather.api.enabled=${WEATHER_API_ENABLED:true}
# Fail fast when Open-Meteo stalls; the dashboard falls back to saved readings.
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=5s
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
# Keep the old UUID migrations disabled; apply the ERD-aligned schema once in Supabase.
spring.flyway.enabled=false
spring.flyway.schemas=public
spring.flyway.default-schema=public
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
server.error.include-stacktrace=never
# [ERD-ALIGNMENT CHANGE] Use the existing quoted USERS table and fields in public.
app.users.schema=${DB_USER_SCHEMA:public}
app.users.table=${DB_USER_TABLE:USERS}
app.users.id=${DB_USER_ID_COLUMN:User_ID}
app.users.name=${DB_USER_NAME_COLUMN:User_Name}
app.users.email=${DB_USER_EMAIL_COLUMN:User_Email}
app.users.hash=${DB_USER_HASH_COLUMN:Password_Hash}


# stuff for mailSender :)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ai stuff
gemini.api.key=${GOOGLE_API_KEY}