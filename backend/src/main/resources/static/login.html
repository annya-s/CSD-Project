                        <div class="input-wrap">
                            <input id="password" class="input" name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Your password" aria-describedby="password-hint">
                            <button class="reveal input-adorn" type="button" data-reveal="password" aria-label="Show password" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="/icons.svg#i-eye"></use></svg></button>
                        </div>
                        <p id="password-hint" class="hint" hidden>Use at least 10 characters.</p>
                    </div>
                    <div id="reset-token-field" class="field" hidden>
                        <label class="label" for="reset-token">Reset code</label>
                        <input id="reset-token" class="input code-input" name="resetToken" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" minlength="6" placeholder="••••••">
                    </div>
                    <div id="new-password-field" class="field" hidden>
                        <label class="label" for="new-password">New password</label>
                        <div class="input-wrap">
                            <input id="new-password" class="input" name="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="At least 10 characters">
                            <button class="reveal input-adorn" type="button" data-reveal="new-password" aria-label="Show password" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="/icons.svg#i-eye"></use></svg></button>
                        </div>
                    </div>
                    <div id="confirm-password-field" class="field" hidden>
                        <label class="label" for="confirm-password">Confirm new password</label>
                        <input id="confirm-password" class="input" name="confirmPassword" type="password" autocomplete="new-password" maxlength="128" placeholder="Repeat the new password">
                    </div>
                    <div id="two-factor-field" class="field" hidden>
                        <label class="label" for="two-factor-code">Login code</label>
                        <input id="two-factor-code" class="input code-input" name="twoFactorCode" type="text" inputmode="numeric"
                               autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••">
                    </div>
                    <p id="auth-error" class="form-error" role="alert" hidden></p>
                    <button id="auth-submit" class="btn btn-primary btn-block" type="submit">Log in</button>
                </form>

                <div class="auth-links">
                    <button id="auth-toggle" class="text-link" type="button">Sign up</button>
                    <button id="forgot-password-link" class="text-link" type="button">Forgot password?</button>
                    <button id="back-to-login" class="text-link" type="button" hidden><svg class="icon icon-sm" aria-hidden="true"><use href="/icons.svg#i-chevron-left"></use></svg>Back to sign in</button>
                </div>
            </div>
            <div id="loading" class="auth" role="status">
                <span class="visually-hidden">Loading…</span>
                <div class="sk-stack" aria-hidden="true">
                    <div class="skeleton sk-line sk-w30"></div>
                    <div class="skeleton sk-title"></div>
                    <div class="skeleton sk-input"></div>
                    <div class="skeleton sk-input"></div>
                </div>
            </div>
            <noscript><p class="auth">Please enable JavaScript to sign in to Dome.</p></noscript>
        </section>
    </main>
</body>
</html>
