<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#495f49">
    <title>Dome · Administration</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/admin.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/admin.html" aria-label="Dome admin">dome<span class="brand-leaf" aria-hidden="true">↗</span></a>
        <nav aria-label="Main navigation">
            <a id="overview-link" class="overview-link"></a>
            <span id="welcome"></span>
        </nav>
        <details>
            <summary class="text-button">Account</summary>
            <div class="account-menu">
                <a href="/account.html" class="text-button" type="button">Manage account</a>
                <button id="logout" class="text-button" type="button">Log out</button>
            </div>
        </details>
    </header>

    <main id="main">
        <p id="global-message" role="alert" hidden></p>
        <p id="loading" class="loading" role="status">Checking administrator access…</p>
        <section id="admin-page" class="page workspace" aria-labelledby="admin-title" hidden>
            <div class="page-heading">
                <div>
                    <span class="small-label">Administration</span>
                    <h1 id="admin-title">User management</h1>
                </div>
            </div>
            <p id="admin-status"></p>
            <section id="users-section" hidden>
                <h2>All accounts</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Email verified</th>
                            <th>Two-factor</th>
                            <th>New password</th>
                        </tr>
                    </thead>
                    <tbody id="users-body"></tbody>
                </table>
            </section>
        </section>
        <noscript><p class="loading">Please enable JavaScript to use the admin dashboard.</p></noscript>
    </main>

    <footer id="site-footer">
        <p class="footer-tagline">Made for a clearer view of your farm.</p>
        <ul class="bottom-bar">
            <li>
                <a href="https://github.com/annya-s/CSD-Project" target="_blank" rel="noopener noreferrer">
                    <svg class="button-icon" aria-hidden="true" viewBox="0 0 24 24">
                        <use href="/icons.svg#github-icon"></use>
                    </svg>
                    <span>GitHub</span>
                </a>
            </li>
        </ul>
    </footer>
</body>
</html>
