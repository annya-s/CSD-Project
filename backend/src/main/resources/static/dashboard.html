<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#495f49">
    <title>Dome · Your crops</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/dashboard.js"></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/dashboard.html" aria-label="Dome home">dome<span class="brand-leaf" aria-hidden="true">↗</span></a>
        <nav id="navigation" aria-label="Main navigation">
            <a href="/dashboard.html" class="overview-link">Overview</a>
            <span id="welcome"></span>
        </nav>
        <button id="logout" class="text-button" type="button">Log out</button>
    </header>
    <main id="main">
        <p id="global-message" role="alert" hidden></p>
        <section id="dashboard-page" class="page workspace" hidden aria-labelledby="dashboard-title">
            <div class="page-heading">
                <div><span class="small-label">A view of your growing season</span><h1 id="dashboard-title" tabindex="-1">Your crops</h1></div>
                <a class="button primary" href="/new-entry.html">+ Add new entry</a>
            </div>
            <p id="summary" class="summary" aria-live="polite"></p>
            <div id="crop-grid" class="crop-grid"></div>
            <div id="empty-state" class="empty-state" hidden>
                <span class="empty-mark" aria-hidden="true">↗</span>
                <h2>Your growing season starts here.</h2>
                <p>Add a crop, its planting date, and its location. Each entry will appear here, ready to open for a closer look.</p>
                <a class="button primary" href="/new-entry.html">Add your first crop</a>
            </div>
        </section>
        <p id="loading" class="loading" role="status">Loading…</p>
        <noscript><p class="loading">Please enable JavaScript to use your farm dashboard.</p></noscript>
    </main>
    <footer>Made for a clearer view of your farm.</footer>
</body>
</html>
