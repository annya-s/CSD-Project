# Disposable local/CI PostgreSQL only. Never use the Supabase DB_* variables here.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://127.0.0.1:5432/farm_ci}
spring.datasource.username=${TEST_DB_USERNAME:farm_ci}
spring.datasource.password=${TEST_DB_PASSWORD:ci_only}
server.servlet.session.cookie.secure=false
weather.api.enabled=false

spring.config.import=
spring.flyway.enabled=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/ci/public-schema.sql
spring.sql.init.data-locations=classpath:db/ci/crop-types.sql
app.users.schema=public
app.users.table=USERS
app.users.id=User_ID
app.users.name=User_Name
app.users.email=User_Email
app.users.hash=Password_Hash


