name: Spring Boot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: farm_ci
          POSTGRES_USER: farm_ci
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farm_ci -d farm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/farm_ci
      TEST_DB_USERNAME: farm_ci
      TEST_DB_PASSWORD: ci_only
      GOOGLE_API_KEY: ci-placeholder-not-a-real-key
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Test public schema on PostgreSQL and package application
        run: sh ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Save test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save application JAR
        uses: actions/upload-artifact@v7
        with:
          name: farm-${{ github.sha }}
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7
