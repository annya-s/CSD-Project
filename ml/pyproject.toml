[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "csd-weather-ml"
version = "0.1.0"
description = "Experimental winter-wheat biomass regression from historical weather"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "pyproj>=3.6,<4", "requests>=2.32,<3",
  "tzdata>=2024.1", "catboost>=1.2.8,<2", "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
